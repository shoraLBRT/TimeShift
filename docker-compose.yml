services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-timeshift};Username=${POSTGRES_USER:-timeshift};Password=${POSTGRES_PASSWORD:-timeshift}"
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__Proxy: ${TELEGRAM_PROXY:-}
      Telegram__AllowedChatIds__0: ${TELEGRAM_ALLOWED_CHAT_ID:-}
      Telegram__AllowAnyone: ${TELEGRAM_ALLOW_ANYONE:-false}
      Web__AccessKey: ${WEB_ACCESS_KEY:-}
      Web__TelegramChatId: ${WEB_TELEGRAM_CHAT_ID:-}
      Push__Subject: ${PUSH_SUBJECT:-}
      Llm__BaseUrl: ${LLM_BASE_URL:-https://api.openai.com/v1}
      Llm__ApiKey: ${LLM_API_KEY:-}
      Llm__Model: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8080:8080"
    restart: unless-stopped

  # HTTPS для web-клиента: docker compose --profile web up -d --build (нужны DOMAIN и WEB_ACCESS_KEY в .env).
  caddy:
    profiles: ["web"]
    image: caddy:2
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timeshift}
      POSTGRES_USER: ${POSTGRES_USER:-timeshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timeshift}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
