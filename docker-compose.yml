services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-timeshift};Username=${POSTGRES_USER:-timeshift};Password=${POSTGRES_PASSWORD:-timeshift}"
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timeshift}
      POSTGRES_USER: ${POSTGRES_USER:-timeshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timeshift}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
