<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TimeShift">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>TimeShift</title>
<script src="/core/boot.js"></script>
<link rel="stylesheet" href="/core/base.css">
<link rel="stylesheet" href="/b/style.css">
</head>
<body>
<div id="gate"></div>

<div id="app" class="b-app" hidden>
  <header class="b-header" id="header">
    <div class="b-bar">
      <button type="button" class="b-month" id="month"><span class="b-month-name" id="month-name"></span><span class="b-month-year" id="month-year"></span></button>
      <div class="b-bar-actions">
        <button type="button" class="b-icon" id="more" aria-label="Ещё" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="7.75" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="16.25" cy="12" r="1.3" fill="currentColor"/></svg>
        </button>
        <button type="button" class="b-icon" id="add" aria-label="Добавить запись">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="b-strip" id="strip" role="group" aria-label="Неделя"><div class="b-strip-track" id="strip-track"></div></div>
    <div class="b-caption">
      <span class="b-caption-text" id="caption" aria-live="polite"></span>
      <button type="button" class="b-today" id="today" hidden>Сегодня</button>
    </div>
  </header>

  <div class="b-scroller" id="scroller" tabindex="-1">
    <div class="b-grid" id="grid">
      <div class="b-hours" id="hours" aria-hidden="true"></div>
      <div class="b-pager" id="pager"><div class="b-track" id="track"></div></div>
      <div class="b-nowlabel" id="nowlabel" aria-hidden="true" hidden></div>
    </div>
  </div>

  <div class="b-now-wrap">
    <div class="b-now" id="now" data-running="false">
      <button type="button" class="b-now-main" id="now-main">
        <span class="b-now-lead" aria-hidden="true">
          <span class="b-now-dot" id="now-dot"></span>
          <svg class="b-now-play" viewBox="0 0 24 24" width="20" height="20"><path d="M8.2 5.3a1 1 0 0 1 1.52-.85l10.2 6.7a1 1 0 0 1 0 1.7l-10.2 6.7a1 1 0 0 1-1.52-.85z" fill="currentColor"/></svg>
        </span>
        <span class="b-now-title" id="now-title"></span>
        <span class="b-now-elapsed" id="now-elapsed"></span>
      </button>
      <button type="button" class="b-now-stop" id="now-stop" aria-label="Закончить" hidden>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.6" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <div class="b-menu-layer" id="menu-layer" hidden>
    <div class="b-menu" id="menu" role="menu" aria-label="Ещё">
      <button type="button" class="b-menu-item" role="menuitem" data-flow="summary">
        <span>Итоги</span>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5.5 19.5v-6M12 19.5v-15M18.5 19.5v-10" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="b-menu-item" role="menuitem" data-flow="assistant">
        <span>Записать фразой</span>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 4.25c-4.7 0-8.5 3.2-8.5 7.2 0 2.2 1.15 4.15 2.97 5.47-.1 1.05-.5 2.1-1.22 2.9 1.75-.05 3.3-.65 4.45-1.55.74.16 1.5.24 2.3.24 4.7 0 8.5-3.2 8.5-7.06s-3.8-7.2-8.5-7.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.5 10h7M8.5 13.25h4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="b-menu-item" role="menuitem" data-flow="settings">
        <span>Настройки</span>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7.5h9.5M18.5 7.5H20M4 16.5h1.5M10.5 16.5H20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="16" cy="7.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="16.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button type="button" class="b-menu-item b-menu-item--section" role="menuitem" data-flow="install" id="menu-install" hidden>
        <span id="menu-install-text">Установить приложение</span>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3.75v10.5M8 7.5l4-3.75 4 3.75" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.75 10.5H6.5a1.5 1.5 0 0 0-1.5 1.5v6.75a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V12a1.5 1.5 0 0 0-1.5-1.5h-1.25" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</div>

<script type="module" src="/b/app.js"></script>
</body>
</html>
